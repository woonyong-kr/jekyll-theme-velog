name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUNDLE_FORCE_RUBY_PLATFORM: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true

      - name: Fetch optional GitHub profile data
        env:
          GITHUB_GRAPHQL_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: ruby scripts/fetch_github_contributions.rb

      - name: Build
        env:
          JEKYLL_ENV: production
        run: >-
          bundle exec ruby scripts/build_site.rb
          --url "${{ steps.pages.outputs.origin }}"
          --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Verify generated site
        run: >-
          python3 scripts/verify_site.py _site
          --baseurl "${{ steps.pages.outputs.base_path }}"
          --expected-origin "${{ steps.pages.outputs.origin }}"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
